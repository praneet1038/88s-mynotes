- name: create ec2 instances & r53 records
  hosts: all
  connection: local
  vars:
    sg_id: sg-00e273e797ad748e9
    img_id: ami-0055977a6e828a4f4
    env: "dev"
    instances:
      - mongodb
      - catalogue
  tasks:
    - name: create ec2
      amazon.aws.ec2_instance:
        security_group: "{{ sg_id }}"
        instance_type: "t3.micro"
        image_id: "{{ img_id }}"
        name: "{{ item }} - {{ env }}"
        tags:
          Name: "{{ item }} - {{ env }}"
          Project: "roboshop"
          Component: "{{ item }}"
          Environment: "{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output
    # - name: print output
    #   ansible.builtin.debug:
    #     msg: "{{ ec2_output.results[0].instances[0]. }}"
    - name: get private ip
      ansible.builtin.debug:
        msg: "{{ item.instances[0].private_ip_address }}"
      loop: "{{ ec2_output.results }}"
    
    - name: Add mongodb.jirawiser.online as an A record with 1 IP and wait until the changes have been replicated
      amazon.aws.route53:
        state: present
        zone: jirawiser.online
        record: mongodb.jirawiser.online
        type: A
        ttl: 1
        value: "{{ item }}"
        wait: true
      when: 1==2 
- name: mongodb module
  hosts: mongodb
  become: yes
  tasks:
    - name: copy repo file to vim /etc/yum.repos.d/mongo.repo
      ansible.builtin.copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo
    # - name: dnf install mongodb-org
    - name: install mongodb
      ansible.builtin.dnf:
        name: mongodb-org
        state: latest
    # - name: update ip address to 0.0.0.0
    - name: replace ip
      ansible.builtin.replace:
        path: /etc/mongod.conf
        regexp: 127.0.0.1
        replace: 0.0.0.0
    # - name: systemctl enable & start mongod service
    # - name: systemctl start mongod service
    - name: enable and start mongod
      ansible.builtin.service:
        name: mongod
        state: started
        enabled: yes

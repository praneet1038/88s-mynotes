- name: demo loops
  hosts: local
  connection: local
  tasks:
  - name: loop items
    ansible.builtin.debug: 
     msg: "{{ item }}"
    loop:
    - one
    - two 
    - three
  - name: install packages
    ansible.builtin.package:
     name: "{{ item }}"
     state: present
    loop:
    - mysql
    - nginx
    - zip

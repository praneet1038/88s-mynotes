- name: demo loops
  hosts: local
  connection: local
  tasks:
  - name: loop items
    ansible.builtin.debug: 
     msg: "{{ item }}"
    loop:
    - one
    - two 
    - three
  - name: install packages
    ansible.builtin.package:
     name: "{{ item }}"
     state: present
    when: false
    loop:
    - mysql
    - nginx
    - zip
  - name: install packages
    ansible.builtin.package:
     name: "{{ item.name }}"
     state: "{{ item.state}}"
    loop:
    - {name: "mysql", state: "absent"}
    - {name: "nginx", state: "present"}
    - {name: "zip", state: "absent"}
    

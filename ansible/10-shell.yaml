- name: shell module
  hosts: local
  connection: local
  tasks:
   - name: search root
     ansible.builtin.shell: cat /etc/passwd | grep root
     register: users_output
   - name: print output
     ansible.builtin.debug: 
      msg: "{{ users_output }}"
   - name: search root
     ansible.builtin.shell: ls -ltr > files.txt
     register: files_output
   - name: print files output
     ansible.builtin.debug: 
      msg: "{{ files_output }}"
      
- name: demo error handling
  hosts: local
  connection: local
  tasks:
  - name: check user
    ansible.builtin.command: id roboshop
    register: cmd_output
    ignore_errors: true
  - name: print output
    ansible.builtin.debug: 
      msg: "{{ cmd_output }}"
  - name: add user
    ansible.builtin.command: useradd roboshop
    when: cmd_output.rc != 0

  

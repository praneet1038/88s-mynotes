- name: demo filters
  hosts: local
  connection: local
  tasks:
  - name: default value
    ansible.builtin.debug: 
     msg: "Hi, {{ GOOD | default('Good Morning')}}"
  - name: convert string to list
    vars:
     NUMBERS: one, two, three
    ansible.builtin.debug: 
     msg: "{{ NUMBERS | split(',')}}"
  - name: dictionary to list
    vars:
     tags:
       Name: ansible
       project: roboshop
       component: catalogue
    ansible.builtin.debug: 
     msg: "{{ tags | dict2items }}"
   